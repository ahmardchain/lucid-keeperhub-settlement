name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run adapter:test
      - uses: actions/upload-artifact@v4
        with:
          name: lucid-settlement-adapter
          path: .release/*.tgz
          include-hidden-files: true
          if-no-files-found: error
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
